name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # the build rebuilds the webassembly module before the javascript, so it
      # needs the rust toolchain and wasm-bindgen. wasm-opt comes from the
      # binaryen package that pnpm install brings in. the toolchain is the one
      # rust-toolchain.toml names, which rustup installs with no argument
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crate

      # the version has to match the wasm-bindgen crate in crate/Cargo.toml,
      # since the cli refuses a module built by a crate newer than itself
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.118

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run type-check

      # src/generated is committed and records a hash of what it was built
      # from. a difference means the crate changed and the module was not
      # rebuilt. this runs before the build, which rewrites src/generated
      - name: The committed module is current
        run: pnpm run check-wasm

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm test

  crate:
    name: Crate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crate

      - name: Format
        run: cargo fmt --manifest-path crate/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path crate/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path crate/Cargo.toml
