[package]
name = "alacrs"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
description = "Apple Lossless (ALAC) decoder in pure Rust"
repository = "https://github.com/marcogomez/alac"
authors = ["Marco Gomez <marco@mgz.dev>"]
readme = "README.md"
keywords = ["alac", "apple-lossless", "audio", "codec", "decoder"]
categories = ["multimedia::audio"]

[lib]
name = "alacrs"
path = "src/lib.rs"
# cdylib for the web build, rlib so the examples and the tests can link it
crate-type = ["cdylib", "rlib"]

[dependencies]

# only the web build needs bindings, and the version is pinned because the
# wasm-bindgen cli refuses a module built by a crate newer than itself
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.118"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
